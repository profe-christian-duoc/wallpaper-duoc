<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #141414;
        min-height: 100vh;
      }

      .bg-duoc {
        position: fixed;
        inset: 0;
        overflow: hidden;
        z-index: -1;
        pointer-events: none;
        user-select: none;
        contain: strict;
      }

      .bg-duoc svg {
        position: absolute;
        width: clamp(140px, 16vw, 240px);
        height: auto;
        fill: none;
        stroke: rgba(255, 255, 255, 0.08);
        stroke-width: 2.5;
        stroke-linejoin: round;
      }

      .d {
        top: 12%;
        left: 2%;
        animation: ruta-a 37s ease-in-out infinite alternate;
      }

      .u {
        bottom: -4%;
        left: 16%;
        animation: ruta-b 43s ease-in-out -11s infinite alternate;
      }

      .o {
        top: -6%;
        right: 22%;
        animation: ruta-c 31s ease-in-out -19s infinite alternate;
      }

      .c {
        bottom: -3%;
        right: 3%;
        animation: ruta-a 41s ease-in-out -7s infinite alternate-reverse;
      }

      @keyframes ruta-a {
        0% {
          transform: translate3d(0, 0, 0) rotate(0deg);
        }
        50% {
          transform: translate3d(45px, 65px, 0) rotate(7deg);
        }
        100% {
          transform: translate3d(-25px, 110px, 0) rotate(-5deg);
        }
      }

      @keyframes ruta-b {
        0% {
          transform: translate3d(0, 0, 0) rotate(0deg);
        }
        50% {
          transform: translate3d(60px, -70px, 0) rotate(-6deg);
        }
        100% {
          transform: translate3d(-35px, -30px, 0) rotate(4deg);
        }
      }

      @keyframes ruta-c {
        0% {
          transform: translate3d(0, 0, 0) rotate(0deg);
        }
        50% {
          transform: translate3d(-55px, 60px, 0) rotate(8deg);
        }
        100% {
          transform: translate3d(40px, 25px, 0) rotate(-4deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .bg-duoc svg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-duoc" aria-hidden="true">
      <!-- Letra D limpia -->
      <svg class="d" viewBox="0 0 120 140">
        <path
          d="M20 15 H62 C95 15 110 38 110 70 C110 102 95 125 62 125 H20 Z M42 36 V104 H60 C80 104 88 90 88 70 C88 50 80 36 60 36 Z"
        />
      </svg>

      <!-- Letra U limpia -->
      <svg class="u" viewBox="0 0 120 140">
        <path
          d="M22 15 H44 V82 C44 98 51 106 62 106 C73 106 80 98 80 82 V15 H102 V83 C102 112 86 127 62 127 C38 127 22 112 22 83 Z"
        />
      </svg>

      <!-- Letra O limpia -->
      <svg class="o" viewBox="0 0 130 140">
        <path
          d="M65 13 C96 13 116 36 116 70 C116 104 96 127 65 127 C34 127 14 104 14 70 C14 36 34 13 65 13 Z M65 34 C46 34 36 49 36 70 C36 91 46 106 65 106 C84 106 94 91 94 70 C94 49 84 34 65 34 Z"
        />
      </svg>

      <!-- Letra C limpia -->
      <svg class="c" viewBox="0 0 120 140">
        <path
          d="M104 46 L84 52 C80 40 72 34 61 34 C43 34 34 49 34 70 C34 91 43 106 61 106 C72 106 80 100 84 88 L104 94 C97 115 82 127 61 127 C30 127 12 104 12 70 C12 36 30 13 61 13 C82 13 97 25 104 46 Z"
        />
      </svg>
    </div>
  </body>
</html>
